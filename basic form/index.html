<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>form</title>
</head>
<body>
    <form action="#" method="get">
        <!-- text input -->
        <div>
        <label for="name1">Name</label>
        <input type="text" name="lastname" id="name1" placeholder="enter your name" required/>
    </div>
    <div>
         <label for="email1">email</label>
        <input type="email" name="email" id="email1" placeholder="xxx@xxx.com" value="abc@abc.com" /></div>
        <div>
         <label for="password1">password</label>
        <input type="password" name="password" id="password1" minlength="3" maxlength="10" /></div>
        <div>
        <textarea type="text" name="message" rows="4" cols="20" style="resize: none;" >Input your message</textarea></div>
        <!-- selection iput -->
        <label for="product">Select your product</label>
        <select name="product" id="product">
            <option value="pc">pc</option>
            <option value="iphone" selected>iphone</option>
            <option value="ipad">ipad</option>
            <option value="watch">watch</option>
        </select>
      <!-- multiple selection -->
       <label for="products">Select your products</label>
        <select name="products" id="products" multiple size="3">
            <option value="pc">pc</option>
            <option value="iphone" selected>iphone</option>
            <option value="ipad">ipad</option>
            <option value="watch">watch</option>
        </select>
        <!-- checkbox -->
        <label for="html">
            <input type="checkbox" name="html" id="html" value="html"checked />html
        </label>
         <label for="css">
            <input type="checkbox" name="css" id="css" value="css" checked />css
        </label>
        <!-- radio button -->
        <label for="small">
        <input type="radio" name="size" id="small" value="small" />small</label>
        <label for="medium"></label>
        <input type="radio" name="size" id="medium" value="medium" />medium
        <label for="large"></label>
        <input type="radio" name="size" id="large" value="large" />large
        <!-- other input type -->
        <label for="date">date</label>
        <input type="date" name="date" id="date" />
         <label for="week">week</label>
        <input type="week" name="week" id="week" />
         <label for="month">month</label>
        <input type="month" name="month" id="month" />
        <label for="time">time</label>
        <input type="time" name="time" id="time" />
        <label for="color">color</label>
        <input type="color" name="color" id="color" />
        <label for="file">file</label>
        <input type="file" name="file" id="file" />
        <label for="range">range</label>
        <input type="range" name="range" id="range" min="0" max="100" step="10"/>
        <button type="submit">Submit</button>
        <br>
        
    </form>
    <!-- data list -->
    <label for="lang">Select your programmiong tools</label>
    <input list="languages" name="lang" id="lang" />
    <datalist id="languages">
        <option value="html"></option>
        <option value="css"></option>
        <option value="javascript"></option>
    </datalist>
    <label for="tick">tick</label>
    <input type="range" name="tick" id="tick" list="tickmarks" min="0" max="100"/>
    <datalist id="tickmarks">
        <option value="0"></option>
        <option value="20"></option>
        <option value="40"></option>
        <option value="60"></option>
        <option value="80"></option>
        <option value="100"></option>
    </datalist>
</body>
</html>
